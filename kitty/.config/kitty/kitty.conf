# vim:fileencoding=utf-8:foldmethod=marker

# =macos settings=
# theme, font and font size
include                ubuntu-theme.conf
font_family            Monaco
font_size              16.0
font-thicken=false
bold-is-bright=false

# tweak rendering for dimmer appearance
text_composition_strategy legacy
#text_gamma_modifier 1.5

# configure the window title bar appearance
#hide_window_decorations titlebar-only
#macos_titlebar_color background


# =macos keybinds=

# split current window
map cmd+enter launch --location=vsplit
map cmd+shift+enter launch --location=hsplit

# split window navigation
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# tab navigation
map cmd+shift+left_bracket  previous_tab
map cmd+shift+right_bracket next_tab

# go to specific tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 0

# common macos clipboard mapping overrides
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# macos specific configurations
macos_option_as_alt    both
macos_quit_on_last_window_close no
#macos_show_window_title_in window

# change font size for individualwindows
# increase font size for the current os window only
map cmd+equal            change_font_size current +2.0
map cmd+plus             change_font_size current +2.0
# decrease font size for the current os window only
map cmd+minus            change_font_size current -2.0
# reset font size back to default for the current os window only
map cmd+0                change_font_size current 0

# change font size for all windows
# increase font size for the current os window only
map cmd+shift+plus       change_font_size all +2.0
map cmd+shift+equal      change_font_size all +2.0
# decrease font size for the current os window only
map cmd+shift+minus      change_font_size all -2.0
# reset font size back to default for the current os window only
map cmd+shift+0          change_font_size all 0


# =general settings=

# disable audible bell
enable_audio_bell no

# disable automatic terminfo copying to remotes
ssh_terminfo_remote no
term xterm-256color

# background opacity & blur
background_opacity     0.85
background_blur        40

# window layout
remember_window_size   no
initial_window_width   80c
initial_window_height  24c
hide_window_decorations no

# cursor & shell integration settings
cursor_shape           block
cursor_blink_interval  0
cursor_text_color      background
shell_integration      no-cursor

# mouse customizations
mouse_hide_while_typing yes
click_interval         0.5

# scrollback limits
scrollback_lines       80000


# tab bar layout & styling
tab_bar_edge           top
tab_bar_style          fade
#tab_bar_style powerline
# sharp triangle cuts
#tab_powerline_style angled
# sharp triangle cuts
#tab_powerline_style slanted
# smooth rounded pills
#tab_powerline_style round

# tab behavior & minimal visibility
tab_bar_min_tabs        2
#tab_activity_symbol     "- "
tab_activity_symbol     "• "
#tab_activity_symbol     "⚡ "
#tab_activity_symbol     "🔔 "


# clipboard & safety settings
# safe but seamless paste actions
paste_actions quote-urls-at-prompt,confirm-if-large

# Enable the flexible splitting layout
enabled_layouts splits, stack, horizontal

# disable kitty ssh multiplexing
share_connections no
# forget shared ssh connections
#map ctrl+shift+x close_shared_ssh_connections


# =set window border=
# Border colors for active and inactive panes
# 00ff00 = green
# cccccc = light grey
# 444444 = dark grey
active_border_color #444444
inactive_border_color #333333

# Force Kitty to draw borders even for a single window pane
draw_window_borders_for_single_window yes

# Ensure the border is drawn on all 4 sides of the window
draw_minimal_borders yes

# Set the thickness of the border line ((e.g., 0.5, 1, 2)
window_border_width 1pt

# Add an outer gap between the border line and your OS desktop
#window_margin_width 4
# Top/Bottom: 4, Left/Right: 4 (Outer only. Splits will have 0 margin between them)
window_margin_width 4 1
single_window_margin_width 4

# Add an inner gap between the border line and your terminal text
# Compact & Balanced Padding (Top/Bottom: 4px, Left/Right: 6px)
# window_padding_width   0 1.5
window_padding_width 4 3


# Load local settings
#include kitty-local.conf

# Shared settings, os specific settings are in {macos,linux,bsd}.conf
# Include a separate config file based on the OS
#include ${KITTY_OS}.conf
